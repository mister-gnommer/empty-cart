name: CI

on:
  push:
    branches:
      - main
      - '001-*'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (exact-pinned)
        run: npm ci

      - name: Lint (Biome — import-boundary zones + style rules)
        run: npx biome lint

      - name: Build (tsc → dist/)
        run: npm run build

      - name: Tests (unit + contract + integration)
        run: npm test